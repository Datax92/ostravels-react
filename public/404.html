<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found (404) | O.S Travel & Tours</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #f8faff 0%, #edf2f9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; color: #1a1a2e; }
    .notfound-card { max-width: 560px; width: 100%; background: #ffffff; border-radius: 20px; padding: 3.5rem 2.5rem; text-align: center; box-shadow: 0 15px 35px rgba(40, 135, 255, 0.08), 0 5px 15px rgba(0, 0, 0, 0.04); border: 1px solid rgba(40, 135, 255, 0.1); position: relative; overflow: hidden; }
    .notfound-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #F5A623 0%, #2887ff 100%); }
    .notfound-code { font-size: 5.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; background: linear-gradient(135deg, #1a1a2e 0%, #2887ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .notfound-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.75rem; color: #1a1a2e; }
    .notfound-desc { font-size: 1rem; color: #64748b; margin-bottom: 2rem; line-height: 1.5; }
    .notfound-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: #F5A623; color: #1a1a2e; padding: 0.85rem 1.8rem; border-radius: 50px; font-weight: 600; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
    .notfound-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 166, 35, 0.3); }
    .notfound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: 2rem; border-top: 1px solid #e2e8f0; padding-top: 1.5rem; }
    .notfound-link { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; padding: 0.75rem 0.5rem; border-radius: 12px; background: #f8faff; color: #1a1a2e; text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .notfound-link:hover { background: #edf2f9; color: #2887ff; }
  </style>
</head>
<body>
  <div class="notfound-card">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">Page Not Found</h1>
    <p class="notfound-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="notfound-btn"><i class="ri-home-4-line"></i> Back to Homepage</a>
    <div class="notfound-grid">
      <a href="/visa/" class="notfound-link"><i class="ri-passport-line"></i><span>Visa Services</span></a>
      <a href="/air-ticketing/" class="notfound-link"><i class="ri-flight-takeoff-line"></i><span>Air Ticketing</span></a>
      <a href="/contact/" class="notfound-link"><i class="ri-mail-line"></i><span>Contact Us</span></a>
    </div>
  </div>
</body>
</html>
